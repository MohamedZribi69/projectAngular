<section class="card team reveal" style="--delay: 150ms" id="friends" aria-labelledby="friends-title">
  <div class="section-heading">
    <div>
      <p class="eyebrow">Your community</p>
      <h2 id="friends-title">My friends</h2>
    </div>
    <div class="stack" aria-hidden="true">
      @for (friend of friends; track friend.name) {
        <span [style.background]="friend.color">{{ friend.initials }}</span>
      }
    </div>
  </div>

  <ul>
    @for (friend of friends; track friend.name; let i = $index) {
      <li class="reveal" [style.--delay.ms]="300 + i * 100">
        <button type="button" (click)="selectedFriend.set(friend)">
          <span class="friend-avatar" aria-hidden="true" [style.background]="friend.color">
            {{ friend.initials }}
            <span class="presence" [class.is-online]="friend.online"></span>
          </span>
          <span class="friend-info">
            <strong>{{ friend.name }}</strong>
            <span>{{ friend.role }}</span>
          </span>
          <span class="status" [class.is-online]="friend.online">{{ friend.status }}</span>
        </button>
      </li>
    }
  </ul>
</section>

@if (selectedFriend(); as friend) {
  <app-modal [label]="friend.name" (closed)="selectedFriend.set(null)">
    <div class="profile-popup">
      <span class="big-avatar" [style.background]="friend.color" aria-hidden="true">
        {{ friend.initials }}
      </span>
      <h2>{{ friend.name }}</h2>
      <p class="role">{{ friend.role }}</p>
      <p class="status" [class.is-online]="friend.online">● {{ friend.status }}</p>
      <div class="popup-actions">
        <button class="btn btn-ghost" type="button" (click)="selectedFriend.set(null)">Close</button>
        <button class="btn" type="button" (click)="wave(friend)">Say hi 👋</button>
      </div>
    </div>
  </app-modal>
}
