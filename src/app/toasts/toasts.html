<div class="toast-stack" aria-live="polite">
  @for (toast of toastService.toasts(); track toast.id) {
    <div class="toast" role="status">
      <span class="icon" aria-hidden="true">{{ toast.icon }}</span>
      <div class="body">
        <strong>{{ toast.title }}</strong>
        <p>{{ toast.message }}</p>
      </div>
      <button type="button" aria-label="Dismiss" (click)="toastService.dismiss(toast.id)">✕</button>
      <span class="timer" aria-hidden="true" [style.animation-duration.ms]="toast.duration"></span>
    </div>
  }
</div>
